<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pastifico | Cozinha</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body {
        background: linear-gradient(135deg, #fff1e8 0%, #f6f1eb 100%);
      }

      .kitchen-shell {
        max-width: 1200px;
        margin: 0 auto;
        padding: 32px 20px 48px;
      }

      .kitchen-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 24px;
      }

      .kitchen-header h1 {
        margin: 0;
        color: var(--primary-dark);
      }

      .kitchen-columns {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 28px;
        align-items: start;
      }

      .kitchen-column {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .kitchen-column-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 6px;
      }

      .kitchen-column-header h2 {
        margin: 0;
        font-size: 1.15rem;
        color: var(--primary-dark);
      }

      .kitchen-column[data-column="ready"] .kitchen-column-header h2 {
        color: var(--secondary);
      }

      .kitchen-count-badge {
        display: inline-grid;
        min-width: 26px;
        height: 26px;
        padding: 0 8px;
        place-items: center;
        border-radius: 999px;
        background: var(--primary);
        color: #fff;
        font-size: 0.78rem;
        font-weight: 700;
      }

      .kitchen-column[data-column="ready"] .kitchen-count-badge {
        background: var(--secondary);
      }

      .kitchen-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 16px;
      }

      .kitchen-empty {
        padding: 26px;
        border-radius: 20px;
        background: rgba(255,255,255,0.72);
        color: var(--muted);
      }

      @media (max-width: 860px) {
        .kitchen-columns {
          grid-template-columns: 1fr;
        }
      }

      .kitchen-card {
        background: rgba(255,255,255,0.8);
        border: 1px solid rgba(143,45,32,0.08);
        border-radius: 28px;
        padding: 20px;
        box-shadow: var(--shadow);
      }

      .order-status-badge {
        background: #fbe2cf;
        color: var(--primary-dark);
        border-radius: 999px;
        padding: 7px 10px;
        font-size: 0.75rem;
        font-weight: 700;
        display: inline-block;
        margin-bottom: 14px;
      }

      .kitchen-card h3 {
        margin: 0 0 6px;
      }

      .kitchen-card p {
        margin: 4px 0;
        color: var(--muted);
      }

      .kitchen-items {
        list-style: none;
        padding: 0;
        margin: 18px 0;
        display: grid;
        gap: 8px;
      }

      .kitchen-items li {
        display: flex;
        justify-content: space-between;
        border-bottom: 1px solid var(--line);
        padding-bottom: 8px;
      }

      .kitchen-items li small {
        color: var(--muted);
        font-weight: 400;
      }

      .status-actions {
        display: flex;
        gap: 10px;
        margin-top: 16px;
      }

      .status-button {
        flex: 1;
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .status-button.primary {
        background: var(--primary);
        color: white;
      }

      .status-button.secondary {
        background: #f3e7dd;
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="kitchen-shell">
      <header class="kitchen-header">
        <div>
          <p class="eyebrow">Painel interno</p>
          <h1>Cozinha Pastifico</h1>
        </div>
        <a class="topbar-badge" href="/" style="text-decoration:none;">Voltar ao menu</a>
      </header>

      <main class="kitchen-columns">
        <section class="kitchen-column" data-column="new">
          <div class="kitchen-column-header">
            <h2>Em preparo</h2>
            <span id="new-orders-count" class="kitchen-count-badge">0</span>
          </div>
          <div id="new-orders-panel" class="kitchen-grid"></div>
        </section>
        <section class="kitchen-column" data-column="ready">
          <div class="kitchen-column-header">
            <h2>Prontos</h2>
            <span id="ready-orders-count" class="kitchen-count-badge">0</span>
          </div>
          <div id="ready-orders-panel" class="kitchen-grid"></div>
        </section>
      </main>
    </div>

    <script src="/kitchen.js"></script>
  </body>
</html>
